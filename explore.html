<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/icon-192.png">
    <meta name="theme-color" content="#ea580c">
    <meta name="description" content="Discover unique culinary and cultural dining experiences in Melbourne. Browse, filter, and book your seat at The Shared Table Story.">
    <title>Explore - The Shared Table Story</title>
    <link rel="stylesheet" href="css/tailwind.css?v=20260224a">
    <link rel="stylesheet" href="css/fonts.css?v=20260224a">
    <link rel="stylesheet" href="vendor/nouislider/nouislider.min.css?v=15.7.0" />
    <script src="vendor/nouislider/nouislider.min.js?v=15.7.0"></script>

<link rel="manifest" href="manifest.json">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">

    <nav id="navbar-placeholder" role="navigation"></nav>

    <main class="flex-grow" role="main">
    <div class="bg-white shadow-sm border-b border-gray-100 transition-all duration-300 filter-shell">
        <div class="container mx-auto px-4 py-4 space-y-3">
            
            <div class="flex flex-col xl:flex-row gap-4">
                <div class="flex-grow flex flex-col md:flex-row gap-2">
                    <div class="relative flex-grow">
                        <label for="search-input" class="sr-only">Search experiences</label>
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="search" id="search-input" placeholder="Search dish, host, or vibe..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm transition">
                    </div>
                    <div class="relative w-full md:w-48">
                        <label for="location-input" class="sr-only">City</label>
                        <i class="fas fa-map-marker-alt absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="text" id="location-input" list="explore-city-suggestions" autocomplete="address-level2" placeholder="City" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm transition">
                        <datalist id="explore-city-suggestions"></datalist>
                    </div>
                    <div class="relative w-full md:w-40">
                        <label for="date-input" class="sr-only">Date</label>
                        <input type="date" id="date-input" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm transition">
                    </div>
                    <div class="relative w-full md:w-32">
                        <label for="guests-input" class="sr-only">Number of guests</label>
                        <i class="fas fa-user-friends absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="number" id="guests-input" min="1" placeholder="Guests" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-sm transition">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="clear-filters-btn" type="button" class="px-4 py-3 bg-white border border-gray-200 text-gray-700 rounded-xl text-sm font-semibold hover:bg-gray-100 transition flex items-center gap-2 whitespace-nowrap"><i class="fas fa-times"></i> Clear</button>
                    <button id="filter-btn" type="button" aria-expanded="false" aria-controls="filter-panel" class="px-5 py-3 border border-gray-200 bg-white text-gray-800 rounded-xl text-sm font-semibold hover:border-orange-500 transition flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fas fa-sliders-h"></i>
                        <span id="filter-btn-label">Filters</span>
                        <span id="filter-count-badge" class="hidden filter-count-badge">0</span>
                    </button>
                </div>
            </div>

            <div id="filter-panel" class="hidden mt-1 p-6 rounded-xl transition-all duration-300 filter-panel-elevated">
                <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
                    <p class="text-xs uppercase tracking-wide font-bold text-gray-500">Fine-Tune Your Experience</p>
                    <p id="filters-summary" class="text-xs text-gray-500">All stories</p>
                </div>
                <div class="flex flex-col md:flex-row gap-8 items-start">
                    <div class="w-full md:w-1/2">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-4" for="price-slider">Price Range</label>
                        <div id="price-slider" class="mb-4 mx-2"></div>
                        <div class="flex justify-between text-sm font-medium text-gray-700">
                            <span id="price-min-label">$0</span>
                            <span id="price-max-label">$300+</span>
                        </div>
                        <input type="hidden" id="min-price" /><input type="hidden" id="max-price" />
                    </div>
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2" for="sort-select">Sort By</label>
                        <div class="relative">
                            <select id="sort-select" class="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-orange-500 appearance-none cursor-pointer">
                                <option value="">Recommended</option>
                                <option value="price_asc">Price: Low to High</option>
                                <option value="rating_desc">Top Rated</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-3 text-gray-400 pointer-events-none"></i>
                        </div>
                        <label for="private-booking-only" class="mt-4 flex items-start gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-gray-700 cursor-pointer">
                            <input id="private-booking-only" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-gray-300 text-orange-600 focus:ring-orange-500">
                            <span class="leading-snug">
                                <span class="font-semibold text-gray-900">Private booking available</span>
                                <span class="block text-xs text-gray-500">Show only experiences with private booking options.</span>
                            </span>
                        </label>
                        <label for="verified-only" class="mt-3 flex items-start gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-gray-700 cursor-pointer">
                            <input id="verified-only" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-gray-300 text-orange-600 focus:ring-orange-500">
                            <span class="leading-snug">
                                <span class="font-semibold text-gray-900">Verified events only</span>
                                <span class="block text-xs text-gray-500">Show only admin-verified experiences.</span>
                            </span>
                        </label>
                    </div>
                    <div class="w-full md:w-1/4 flex items-end">
                        <button id="apply-filters" type="button" class="w-full tsts-btn-primary px-6 py-2.5 rounded-xl font-bold transition shadow-sm">Apply</button>
                    </div>
                </div>
            </div>

            <div id="active-filters-bar" aria-live="polite" aria-label="Active filters" class="flex flex-wrap gap-2 text-xs"></div>

            <div class="flex gap-2 mt-4 overflow-x-auto pb-2 scrollbar-hide" id="category-chips" aria-label="Category filters">
                <button type="button" class="filter-chip active px-4 py-2.5 tsts-indicator-ink rounded-full text-sm font-medium whitespace-nowrap transition border border-transparent" data-category="all">
                    All Stories
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="food-gatherings">
                    <i class="fas fa-utensils mr-1"></i> Food & Gatherings
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="explore-outdoors">
                    <i class="fas fa-mountain mr-1"></i> Explore & Outdoors
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="culture-stories">
                    <i class="fas fa-book-open mr-1"></i> Culture & Stories
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="social-nights">
                    <i class="fas fa-moon mr-1"></i> Social & Nights
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="move-wellness">
                    <i class="fas fa-spa mr-1"></i> Move & Wellness
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="create-express">
                    <i class="fas fa-paint-brush mr-1"></i> Create & Express
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="learn-passion">
                    <i class="fas fa-lightbulb mr-1"></i> Learn & Passion
                </button>
                <button type="button" class="filter-chip px-4 py-2.5 bg-tsts-cream border border-slate-200 text-slate-600 rounded-full text-sm font-medium whitespace-nowrap hover:border-orange-500 transition" data-category="games-play">
                    <i class="fas fa-dice mr-1"></i> Games & Play
                </button>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8 flex-grow">
<section id="explore-curations" class="hidden pb-6">
  <div class="max-w-7xl mx-auto">
    <div id="explore-curations-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </div>
</section>
        <div id="experiences-grid" aria-live="polite" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="bg-white rounded-3xl shadow-soft-card p-4 space-y-3"><div class="skeleton h-40 w-full"></div><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div><div class="skeleton h-3 w-1/3"></div></div>
            <div class="bg-white rounded-3xl shadow-soft-card p-4 space-y-3"><div class="skeleton h-40 w-full"></div><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div><div class="skeleton h-3 w-1/3"></div></div>
            <div class="bg-white rounded-3xl shadow-soft-card p-4 space-y-3 hidden md:block"><div class="skeleton h-40 w-full"></div><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div><div class="skeleton h-3 w-1/3"></div></div>
            <div class="bg-white rounded-3xl shadow-soft-card p-4 space-y-3 hidden xl:block"><div class="skeleton h-40 w-full"></div><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div><div class="skeleton h-3 w-1/3"></div></div>
        </div>
        <div id="no-results" aria-live="polite" class="hidden text-center py-12">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-orange-50 flex items-center justify-center text-orange-600">
                <i class="far fa-compass text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold heading-serif text-tsts-ink mb-2">No experiences found</h3>
            <p class="text-gray-500 mb-8">Try adjusting your filters.</p>
            <button id="clear-filters-empty-btn" type="button" class="text-orange-600 font-bold hover:underline">Clear all filters</button>
        </div>
        <div id="load-error" class="hidden text-center py-12">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-gray-100 flex items-center justify-center text-gray-700">
                <i class="fas fa-plug text-xl"></i>
            </div>
            <h3 class="text-xl font-bold heading-serif text-tsts-ink mb-2">Couldn’t load stories</h3>
            <p class="text-gray-500 mb-8">Please check your connection and try again.</p>
            <button id="retry-load-btn" type="button" class="inline-flex items-center gap-2 tsts-btn-primary px-6 py-3 rounded-xl font-bold transition shadow-sm">
                <i class="fas fa-rotate-right"></i> Try again
            </button>
        </div>
    </div>
    </main>

    <footer id="footer-placeholder" role="contentinfo"></footer>
    <script src="js/runtime-config.js?v=20260224a"></script>
  <script src="js/common.js?v=20260227c"></script>
    <script src="js/explore.js?v=20260227d"></script>
</body>
</html>
