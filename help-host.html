<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen help-center">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main class="flex-grow" role="main">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-0 py-12 sm:py-16 space-y-8">
      <header class="rounded-3xl bg-white/90 border border-white shadow-soft-card px-6 sm:px-8 py-8">
        <a href="help-center.html" class="inline-flex items-center rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-800 hover:bg-slate-50 transition mb-4">← Back to FAQs</a>
        <p class="text-xs tracking-[0.18em] font-semibold text-slate-500 mb-2">FAQs</p>
        <h1 class="heading-serif text-3xl sm:text-4xl font-semibold text-tsts-ink">Host FAQ</h1>
        <p class="mt-3 text-sm sm:text-base text-slate-700 max-w-2xl">
          Answers for onboarding, listings, host operations, payouts, refunds, and safety responsibilities.
        </p>
      </header>

      <section id="faq-hub-root" data-faq-hub="host" class="bg-white rounded-3xl border border-gray-100 shadow-soft-card p-6 space-y-4">
        <div class="help-center-sticky-search bg-white/95 rounded-xl">
          <label for="host-faq-search" class="sr-only">Search host questions</label>
          <input
            id="host-faq-search"
            data-faq-search
            type="search"
            placeholder="Search host questions..."
            class="w-full rounded-xl border border-slate-200 bg-slate-50/70 px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent"
          />
        </div>
        <p data-faq-count class="hidden"></p>
        <div data-faq-list class="space-y-3"></div>
        <p data-faq-empty class="hidden rounded-xl border border-dashed border-slate-300 bg-white px-4 py-4 text-sm text-slate-500">No matching questions yet. Try a different keyword.</p>
        <div data-faq-escalation class="mt-8"></div>
      </section>
    </div>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260224a"></script>
