<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <meta name="theme-color" content="#ea580c">
  <title>Report – The Shared Table Story</title>
  <link rel="stylesheet" href="css/tailwind.css?v=20260224a">
  <link rel="stylesheet" href="css/fonts.css?v=20260224a">

  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main class="flex-grow container mx-auto px-4 py-10 max-w-2xl" role="main">
    <h1 class="text-3xl font-bold mb-2 heading-serif text-tsts-ink">Report</h1>
    <p class="text-gray-600 mb-6">Help us keep the community safe. Reports are reviewed by admins.</p>

    <div id="alert" class="hidden mb-4 rounded-xl border px-4 py-3 text-sm"></div>

    <form id="report-form" class="bg-white rounded-3xl border border-gray-100 shadow-soft-card p-6 space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1" for="targetType">Target type</label>
        <select id="targetType" class="w-full p-3 bg-gray-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition">
          <option value="user">User</option>
          <option value="experience">Experience</option>
          <option value="booking">Booking</option>
          <option value="review">Review</option>
          <option value="comment">Comment</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1" for="targetId">Target id</label>
        <input id="targetId" type="text" placeholder="Auto-filled from URL" class="w-full p-3 bg-gray-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition" required />
        <p id="targetId-helper" class="text-xs text-gray-500 mt-1 hidden">Target ID must be provided via URL parameter.</p>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1" for="category">Category</label>
        <select id="category" class="w-full p-3 bg-gray-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition">
          <option value="spam">Spam</option>
          <option value="harassment">Harassment</option>
          <option value="fraud">Fraud</option>
          <option value="safety">Safety</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1" for="message">Details</label>
        <textarea id="message" rows="5" placeholder="What happened? Include any context that helps." class="w-full p-3 bg-gray-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition"></textarea>
      </div>

      <button id="submit-btn" type="submit" class="w-full py-3 tsts-btn-primary font-bold rounded-xl transition transform active:scale-95 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
        Submit report
      </button>

      <p class="text-xs text-gray-500">Do not include sensitive personal data. Reports are stored and reviewed for moderation.</p>
      <p class="text-xs text-gray-500 mt-2">See our <a href="terms.html" class="underline hover:text-orange-600">Terms of Service</a> for community conduct standards.</p>
    </form>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260224a"></script>
  <script src="js/common.js?v=20260227d"></script>
  <script src="js/report.js?v=20260303a"></script>
</body>
</html>
