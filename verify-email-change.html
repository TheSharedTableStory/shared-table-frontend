<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm Email Change – The Shared Table Story</title>
  <link rel="stylesheet" href="css/tailwind.css?v=20260304d">
  <link rel="stylesheet" href="css/fonts.css?v=20260310d">

  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <link rel="apple-touch-icon" href="/assets/logo-mark.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main class="flex-grow flex flex-col items-center justify-center px-4 py-12" role="main">
    <div class="max-w-md w-full text-center">

      <div id="state-loading" class="py-12">
        <div class="h-16 w-16 bg-orange-100 rounded-full flex items-center justify-center text-3xl mx-auto mb-6 shadow-sm">
          <i class="fas fa-spinner fa-spin text-orange-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Confirming your new email...</h1>
        <p class="text-gray-500">Please wait while we update your email address.</p>
      </div>

      <div id="state-success" class="hidden py-12">
        <div class="h-16 w-16 bg-green-100 rounded-full flex items-center justify-center text-3xl mx-auto mb-6 shadow-sm">
          &#10003;
        </div>
        <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Email Updated!</h1>
        <p id="success-message" class="text-gray-500 mb-8">Your email address has been successfully changed. Please log in with your new email.</p>
        <a href="login.html" class="inline-block px-8 py-3 tsts-btn-primary font-bold rounded-xl shadow-lg transition transform hover:scale-105">
          Log In
        </a>
      </div>

      <div id="state-error" class="hidden py-12">
        <div class="h-16 w-16 bg-red-100 rounded-full flex items-center justify-center text-3xl mx-auto mb-6 shadow-sm">
          &#10007;
        </div>
        <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Confirmation Failed</h1>
        <p id="error-message" class="text-gray-500 mb-8">The confirmation link is invalid or has expired.</p>
        <a href="profile.html" class="inline-block px-8 py-3 tsts-btn-primary font-bold rounded-xl shadow-lg transition">
          Go to Profile
        </a>
      </div>

    </div>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260224a"></script>
  <script src="js/common.js?v=20260310a"></script>
  <script src="js/verify-email-change.js?v=20260224a"></script>
</body>
</html>
