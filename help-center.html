<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <meta name="theme-color" content="#ea580c">
  <meta name="description" content="Find answers about booking, hosting, payments, and policies in the The Shared Table Story FAQs.">
  <title>FAQs — The Shared Table Story</title>

  <link rel="stylesheet" href="css/tailwind.css?v=20260222c">
  <link rel="stylesheet" href="css/fonts.css?v=20260222c">
  <link rel="stylesheet" href="css/help-center.css?v=20260222f">
  <link rel="manifest" href="manifest.json">
</head>

<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen help-center">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main class="flex-grow" role="main">
    <div id="help-root" class="max-w-3xl mx-auto px-6 py-12 space-y-8">
      <header>
        <p class="text-xs uppercase tracking-[0.2em] text-slate-500 mb-2">FAQs</p>
        <h1 class="text-3xl font-bold mb-2 heading-serif text-tsts-ink">How can we help today?</h1>
        <p class="text-gray-500 text-sm">
          Choose a section to see all related questions and answers on this page.
        </p>
      </header>

      <section aria-label="FAQ sections">
        <div class="help-center-hub-grid">
          <button
            type="button"
            class="help-center-hub-tile border border-gray-100 rounded-lg bg-gray-50/80 px-4 py-3 text-left hover:bg-gray-100 transition"
            data-hub-toggle="guest"
            aria-expanded="false"
            aria-controls="faq-hub-panel-guest"
          >
            <span class="flex items-center justify-between gap-3">
              <span>
                <span class="block text-sm font-semibold text-gray-900">Guest FAQ</span>
                <span class="block text-xs text-gray-500 mt-1">Booking, payments, cancellations, and support.</span>
              </span>
              <span class="help-center-chevron text-gray-500 text-sm" data-hub-icon>⌄</span>
            </span>
          </button>

          <button
            type="button"
            class="help-center-hub-tile border border-gray-100 rounded-lg bg-gray-50/80 px-4 py-3 text-left hover:bg-gray-100 transition"
            data-hub-toggle="host"
            aria-expanded="false"
            aria-controls="faq-hub-panel-host"
          >
            <span class="flex items-center justify-between gap-3">
              <span>
                <span class="block text-sm font-semibold text-gray-900">Host FAQ</span>
                <span class="block text-xs text-gray-500 mt-1">Hosting setup, bookings, payouts, and policies.</span>
              </span>
              <span class="help-center-chevron text-gray-500 text-sm" data-hub-icon>⌄</span>
            </span>
          </button>

          <button
            type="button"
            class="help-center-hub-tile help-center-hub-tile--wide border border-gray-100 rounded-lg bg-gray-50/80 px-4 py-3 text-left hover:bg-gray-100 transition"
            data-hub-toggle="platform"
            aria-expanded="false"
            aria-controls="faq-hub-panel-platform"
          >
            <span class="flex items-center justify-between gap-3">
              <span>
                <span class="block text-sm font-semibold text-gray-900">How The Platform Works</span>
                <span class="block text-xs text-gray-500 mt-1">Roles, lifecycle, trust, and payment process.</span>
              </span>
              <span class="help-center-chevron text-gray-500 text-sm" data-hub-icon>⌄</span>
            </span>
          </button>
        </div>
      </section>

      <section id="faq-active-shell" class="hidden space-y-3" aria-live="polite">
        <div class="border border-gray-100 rounded-lg bg-white px-4 py-3">
          <h2 id="faq-active-title" class="text-sm font-semibold text-gray-900"></h2>
          <p id="faq-active-subtitle" class="text-xs text-gray-500 mt-1"></p>
        </div>

        <div id="faq-hub-panel-guest" class="help-center-hub-panel hidden">
          <div id="faq-hub-guest-root" class="space-y-3"></div>
        </div>
        <div id="faq-hub-panel-host" class="help-center-hub-panel hidden">
          <div id="faq-hub-host-root" class="space-y-3"></div>
        </div>
        <div id="faq-hub-panel-platform" class="help-center-hub-panel hidden">
          <div id="faq-hub-platform-root" class="space-y-3"></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260222c"></script>
  <script src="js/common.js?v=20260222c"></script>
  <script src="data/faq-catalog.js?v=20260222f"></script>
  <script src="data/faq-trust.js?v=20260222f"></script>
  <script src="js/faq-renderer.js?v=20260222f"></script>
  <script src="js/faq-contextual.js?v=20260222f"></script>
  <script src="js/faq-init.js?v=20260222f"></script>
  <script src="js/help-center.js?v=20260222f"></script>
</body>
</html>
