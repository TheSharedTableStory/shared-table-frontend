<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <meta name="theme-color" content="#ea580c">
  <meta name="description" content="Find answers about booking, hosting, payments, and policies in the The Shared Table Story FAQs.">
  <title>FAQs — The Shared Table Story</title>

  <link rel="stylesheet" href="css/tailwind.css?v=20260222c">
  <link rel="stylesheet" href="css/fonts.css?v=20260222c">
  <link rel="stylesheet" href="css/help-center.css?v=20260222a">
  <link rel="manifest" href="manifest.json">
</head>

<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen help-center">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main class="min-h-screen" role="main">
    <div id="help-root" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-0 py-12 sm:py-16 space-y-10">
      <header class="rounded-3xl bg-white/90 border border-white shadow-soft-card px-6 sm:px-8 py-8">
        <p class="text-xs uppercase tracking-[0.2em] text-slate-500 mb-2">FAQs</p>
        <h1 class="heading-serif text-3xl sm:text-4xl font-semibold text-tsts-ink">How can we help today?</h1>
        <p class="mt-3 text-sm sm:text-base text-slate-700 max-w-2xl">
          Pick a section and expand it to read questions and answers on this same page.
        </p>
      </header>

      <section class="rounded-3xl border border-white bg-white/90 shadow-soft-card px-5 py-5 sm:px-6 sm:py-6 space-y-4">
        <div class="help-center-hub-toolbar" role="navigation" aria-label="FAQ sections">
          <button type="button" class="help-center-hub-tile rounded-2xl border border-slate-200 bg-white px-4 py-4 text-left" data-hub-toggle="guest" aria-expanded="false" aria-controls="faq-hub-panel-guest">
            <span class="block text-xs uppercase tracking-[0.16em] text-slate-500 mb-2">For Guests</span>
            <span class="flex items-start justify-between gap-3">
              <span>
                <span class="block heading-serif text-xl font-semibold text-tsts-ink mb-1">Guest FAQ</span>
                <span class="block text-sm text-slate-700">Booking, payments, cancellations, and support.</span>
              </span>
              <span class="text-xl leading-none text-slate-500" data-hub-icon>+</span>
            </span>
          </button>

          <button type="button" class="help-center-hub-tile rounded-2xl border border-slate-200 bg-white px-4 py-4 text-left" data-hub-toggle="host" aria-expanded="false" aria-controls="faq-hub-panel-host">
            <span class="block text-xs uppercase tracking-[0.16em] text-slate-500 mb-2">For Hosts</span>
            <span class="flex items-start justify-between gap-3">
              <span>
                <span class="block heading-serif text-xl font-semibold text-tsts-ink mb-1">Host FAQ</span>
                <span class="block text-sm text-slate-700">Hosting setup, bookings, payouts, and policies.</span>
              </span>
              <span class="text-xl leading-none text-slate-500" data-hub-icon>+</span>
            </span>
          </button>

          <button type="button" class="help-center-hub-tile rounded-2xl border border-slate-200 bg-white px-4 py-4 text-left" data-hub-toggle="platform" aria-expanded="false" aria-controls="faq-hub-panel-platform">
            <span class="block text-xs uppercase tracking-[0.16em] text-slate-500 mb-2">Platform Overview</span>
            <span class="flex items-start justify-between gap-3">
              <span>
                <span class="block heading-serif text-xl font-semibold text-tsts-ink mb-1">How The Platform Works</span>
                <span class="block text-sm text-slate-700">Lifecycle, trust model, and payments overview.</span>
              </span>
              <span class="text-xl leading-none text-slate-500" data-hub-icon>+</span>
            </span>
          </button>

          <button type="button" class="help-center-hub-tile rounded-2xl border border-slate-200 bg-white px-4 py-4 text-left" data-hub-toggle="trust" aria-expanded="false" aria-controls="faq-hub-panel-trust">
            <span class="block text-xs uppercase tracking-[0.16em] text-slate-500 mb-2">Trust &amp; Safety</span>
            <span class="flex items-start justify-between gap-3">
              <span>
                <span class="block heading-serif text-xl font-semibold text-tsts-ink mb-1">Trust &amp; Safety Questions</span>
                <span class="block text-sm text-slate-700">Refunds, cancellations, payment safety, and location privacy.</span>
              </span>
              <span class="text-xl leading-none text-slate-500" data-hub-icon>+</span>
            </span>
          </button>
        </div>

        <div id="faq-hub-panel-guest" class="help-center-hub-panel hidden rounded-2xl border border-slate-200 bg-white p-4 sm:p-5">
          <div id="faq-hub-guest-root" class="space-y-4"></div>
        </div>

        <div id="faq-hub-panel-host" class="help-center-hub-panel hidden rounded-2xl border border-slate-200 bg-white p-4 sm:p-5">
          <div id="faq-hub-host-root" class="space-y-4"></div>
        </div>

        <div id="faq-hub-panel-platform" class="help-center-hub-panel hidden rounded-2xl border border-slate-200 bg-white p-4 sm:p-5">
          <div id="faq-hub-platform-root" class="space-y-4"></div>
        </div>

        <div id="faq-hub-panel-trust" class="help-center-hub-panel hidden rounded-2xl border border-slate-200 bg-white p-4 sm:p-5">
          <div id="faq-hub-trust-root" class="space-y-4"></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260222c"></script>
  <script src="js/common.js?v=20260222c"></script>
  <script src="data/faq-catalog.js?v=20260222a"></script>
  <script src="data/faq-trust.js?v=20260222a"></script>
  <script src="js/faq-renderer.js?v=20260222a"></script>
  <script src="js/faq-contextual.js?v=20260222a"></script>
  <script src="js/faq-init.js?v=20260222a"></script>
  <script src="js/help-center.js?v=20260222b"></script>
</body>
</html>
