<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – The Shared Table Story</title>
  <link rel="stylesheet" href="css/tailwind.css?v=20260304d">
  <link rel="stylesheet" href="css/fonts.css?v=20260304g">

  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main class="flex-grow" role="main">
    <div class="max-w-md mx-auto px-4 py-10">
      <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Reset your password</h1>
      <p class="text-sm text-gray-600 mb-6">Enter the 6-digit code sent to your email, then choose a new password.</p>

      <div id="alert" class="hidden mb-4 rounded-xl border px-4 py-3 text-sm"></div>

      <form id="reset-form" class="bg-white rounded-3xl border border-gray-100 shadow-soft-card p-6 space-y-4" autocomplete="on">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1" for="otpCode">Verification code</label>
          <input id="otpCode" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition text-center text-2xl tracking-widest font-mono" placeholder="000000" required />
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1" for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition" minlength="8" required />
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1" for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition" minlength="8" required />
        </div>

        <button id="submit-btn" type="submit" class="w-full py-3 tsts-btn-primary font-bold rounded-xl transition transform active:scale-95 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
          Reset Password
        </button>

        <p class="text-xs text-gray-500">
          After resetting your password, you’ll be redirected to login.
        </p>
      </form>
    </div>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260224a"></script>
  <script src="js/common.js?v=20260305a"></script>
  <script src="js/reset-password.js?v=20260303a"></script>
</body>
</html>
