<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – The Shared Table Story</title>
  <link rel="stylesheet" href="css/tailwind.css?v=20260317b">
  <link rel="stylesheet" href="css/fonts.css?v=20260310d">

  <link rel="icon" type="image/png" href="/assets/logo-mark.png">
  <link rel="apple-touch-icon" href="/assets/logo-mark.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">

  <style>
    /* OTP cells — match mobile sheet visuals (48x52, 8px gap, rounded, focus ring orange) */
    .tsts-otp-row { display: flex; justify-content: center; gap: 8px; }
    .tsts-otp-cell {
      width: 48px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      text-align: center;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 22px;
      color: #1f2937;
      caret-color: #ea580c;
      outline: none;
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .tsts-otp-cell:focus {
      border-color: #ea580c;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.18);
    }
    .tsts-otp-cell.is-filled {
      border-color: #ea580c;
      background: #ffffff;
    }
    .tsts-otp-cell.is-error {
      border-color: #dc2626;
      background: #fef2f2;
    }
    /* Read-only summary rows shown after a step is completed.
       Use :not(.hidden) so Tailwind's .hidden { display:none } wins. */
    .tsts-summary-row:not(.hidden) {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      color: #374151;
    }
    /* Same fix for the success banner */
    .tsts-banner-success.hidden { display: none; }
    .tsts-summary-row .tsts-summary-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #d1fae5;
      color: #047857;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }
    .tsts-summary-row .tsts-summary-label {
      color: #6b7280;
      flex-shrink: 0;
    }
    .tsts-summary-row .tsts-summary-value {
      color: #1f2937;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Persistent green confirmation banner shown after Send Code */
    .tsts-banner-success:not(.hidden) {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .tsts-banner-success .tsts-banner-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #10b981;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      margin-top: 1px;
    }
    /* Success step — peach circle with green check */
    .tsts-success-circle {
      width: 80px;
      height: 80px;
      border-radius: 999px;
      background: #fed7aa;
      color: #047857;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      margin: 0 auto;
    }
    /* Live password validation hint */
    .tsts-pw-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-top: 6px;
    }
    .tsts-pw-hint.is-good { color: #047857; }
    .tsts-pw-hint.is-warn { color: #b45309; }
    .tsts-pw-hint.is-bad  { color: #dc2626; }
  </style>
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main id="main" class="flex-grow" role="main">
    <div class="max-w-md mx-auto px-4 py-10">
      <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Reset your password</h1>
      <p id="page-subtitle" class="text-sm text-gray-600 mb-6">Enter your email and we’ll send you a 6-digit code.</p>

      <div id="alert" class="hidden mb-4 rounded-xl border px-4 py-3 text-sm" role="status" aria-live="polite"></div>

      <div class="bg-white rounded-3xl border border-gray-100 shadow-soft-card p-6 space-y-5">

        <!-- ─── Step 1: email entry ─────────────────────────────────────── -->
        <section id="step-1" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1" for="emailField">Email address</label>
            <input id="emailField" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition" required />
          </div>

          <button id="send-code-btn" type="button" class="w-full py-3 tsts-btn-primary font-bold rounded-xl transition transform active:scale-95 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed">
            Send Code
          </button>

          <p class="text-center text-xs text-slate-500">
            <a href="login.html" class="font-bold text-orange-600 hover:underline">Back to Login</a>
          </p>
        </section>

        <!-- ─── Step 2 + Step 3 share the same email-summary at the top ── -->
        <div id="email-summary" class="tsts-summary-row hidden" aria-hidden="true">
          <span class="tsts-summary-icon">✓</span>
          <span class="tsts-summary-label">Email</span>
          <span class="tsts-summary-value" id="email-summary-value"></span>
        </div>

        <!-- ─── Step 2: OTP entry ───────────────────────────────────────── -->
        <section id="step-2" class="space-y-4 hidden" aria-hidden="true">
          <div id="sent-banner" class="tsts-banner-success">
            <span class="tsts-banner-icon">✓</span>
            <span>We sent a 6-digit code to <span id="sent-banner-email" class="font-semibold"></span>. Enter it below to continue.</span>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2 text-center" id="otp-label">Verification code</label>
            <div class="tsts-otp-row" role="group" aria-labelledby="otp-label">
              <input class="tsts-otp-cell" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" data-otp-cell="0" aria-label="Digit 1 of 6" />
              <input class="tsts-otp-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-cell="1" aria-label="Digit 2 of 6" />
              <input class="tsts-otp-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-cell="2" aria-label="Digit 3 of 6" />
              <input class="tsts-otp-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-cell="3" aria-label="Digit 4 of 6" />
              <input class="tsts-otp-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-cell="4" aria-label="Digit 5 of 6" />
              <input class="tsts-otp-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-otp-cell="5" aria-label="Digit 6 of 6" />
            </div>
            <p id="otp-error" class="hidden text-xs text-red-600 text-center mt-2" role="alert"></p>
          </div>

          <button id="verify-code-btn" type="button" class="w-full py-3 tsts-btn-primary font-bold rounded-xl transition transform active:scale-95 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Verify Code
          </button>

          <p class="text-center text-xs text-slate-500">
            Didn’t receive it?
            <button id="resend-code-btn" type="button" class="font-bold text-orange-600 hover:underline disabled:text-gray-400 disabled:cursor-not-allowed disabled:no-underline" disabled>
              Resend (60s)
            </button>
          </p>
        </section>

        <!-- ─── Step 3: new password ────────────────────────────────────── -->
        <section id="step-3" class="space-y-4 hidden" aria-hidden="true">
          <p class="text-sm text-gray-600">Choose a new password below.</p>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1" for="newPassword">New password</label>
            <div class="relative">
              <input id="newPassword" type="password" maxlength="24" autocomplete="new-password" class="w-full p-3 pr-11 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition" minlength="8" required />
              <button id="toggle-newPassword" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-gray-500 hover:text-gray-700" aria-label="Show password">
                <span aria-hidden="true">👁</span>
              </button>
            </div>
            <p id="pw-hint" class="tsts-pw-hint hidden"></p>
          </div>

          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1" for="confirmPassword">Confirm new password</label>
            <div class="relative">
              <input id="confirmPassword" type="password" maxlength="24" autocomplete="new-password" class="w-full p-3 pr-11 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-tsts-clay/60 focus:border-transparent transition" minlength="8" required />
              <button id="toggle-confirmPassword" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-gray-500 hover:text-gray-700" aria-label="Show password">
                <span aria-hidden="true">👁</span>
              </button>
            </div>
            <p id="confirm-hint" class="tsts-pw-hint hidden"></p>
          </div>

          <button id="reset-password-btn" type="button" class="w-full py-3 tsts-btn-primary font-bold rounded-xl transition transform active:scale-95 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Reset Password
          </button>
        </section>

        <!-- ─── Step 4: success ─────────────────────────────────────────── -->
        <section id="step-4" class="space-y-5 text-center hidden" aria-hidden="true">
          <div class="tsts-success-circle" aria-hidden="true">✓</div>
          <h2 class="text-2xl font-bold text-tsts-ink heading-serif">Password updated</h2>
          <p class="text-sm text-gray-600">You’re all set. Welcome back.</p>
          <button id="continue-btn" type="button" class="w-full py-3 tsts-btn-primary font-bold rounded-xl transition transform active:scale-95 shadow-lg">
            Continue
          </button>
        </section>

      </div>
    </div>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260224a"></script>
  <script src="js/common.js?v=20260316c"></script>
  <script src="js/reset-password.js?v=20260430a"></script>
</body>
</html>
