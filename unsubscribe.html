<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' http://localhost:4000 https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/logo-mark.png">
    <meta name="theme-color" content="#ea580c">
    <title>Unsubscribe - The Shared Table Story</title>
    <link rel="stylesheet" href="css/tailwind.css?v=20260914a">
    <link rel="stylesheet" href="css/fonts.css?v=20260810a">

    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">

    <nav id="navbar-placeholder" role="navigation"></nav>

    <main class="flex-grow container mx-auto px-4 py-10" role="main">
        <div class="max-w-lg mx-auto">
            <div id="state-confirm" class="bg-white rounded-3xl border border-gray-100 shadow-soft-card p-8 text-center">
                <div class="mb-4">
                    <i class="fas fa-envelope-open text-4xl text-orange-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Unsubscribe from emails</h1>
                <p id="confirm-text" class="text-slate-600 mb-6"></p>
                <button id="confirm-btn" type="button" class="px-6 py-2.5 rounded-xl tsts-btn-primary font-bold transition">
                    Confirm Unsubscribe
                </button>
                <p id="confirm-status" class="text-sm mt-4 hidden"></p>
            </div>

            <div id="state-success" class="hidden bg-white rounded-3xl border border-green-100 shadow-soft-card p-8 text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle text-4xl text-green-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Unsubscribed</h1>
                <p id="success-text" class="text-slate-600 mb-6"></p>
                <a href="profile.html" class="inline-block px-6 py-2.5 rounded-xl tsts-btn-primary font-bold transition">
                    Manage Email Preferences
                </a>
            </div>

            <!-- sir 2026-08-16, verbatim (approval log :680): "and you dont see red test and
                 ucking nonsense on screen and you think widening it is right?" + "Fix it" — the
                 error card was an all-red alarm (red heading + red paragraph). Implemented fix:
                 red kept on the icon only, heading/paragraph use the platform's normal ink/grey. -->
            <div id="state-error" class="hidden bg-white rounded-3xl border border-gray-100 shadow-soft-card p-8 text-center">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">This link didn't work</h1>
                <p id="error-text" class="text-gray-600 mb-6"></p>
                <a href="profile.html" class="inline-block px-6 py-2.5 rounded-xl tsts-btn-primary font-bold transition">
                    Manage Email Preferences
                </a>
                <!-- Added 2026-08-22. This card is reached from an unsubscribe link by someone who
                     wants the emails to STOP, and the only route offered was Manage Email
                     Preferences — which goes to profile.html and requires signing in. A person who
                     cannot sign in, or who no longer wants an account at all, had NO way to stop
                     the mail from here. That is a dead end on the one page whose entire purpose is
                     to end contact. Derived, not authored: report.js already handles exactly this
                     shape — when the normal route does not apply it names the contact address and
                     says the team will take it from there. Same solution, same voice. -->
                <p class="text-sm text-gray-500 mt-4">
                    Can't sign in? Email <a href="mailto:contact@thesharedtablestory.com" class="underline font-semibold text-orange-600 hover:text-orange-700">contact@thesharedtablestory.com</a> and we'll stop the emails for you.
                </p>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder" role="contentinfo"></footer>
    <script src="js/runtime-config.js?v=20260224a"></script>
    <script src="js/common.js?v=20260907a"></script>
    <script src="js/unsubscribe.js?v=20260822a"></script>
</body>
</html>
