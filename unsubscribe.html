<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com http://localhost:* http://127.0.0.1:*; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/icon-192.png">
    <meta name="theme-color" content="#ea580c">
    <title>Unsubscribe - The Shared Table Story</title>
    <link rel="stylesheet" href="css/tailwind.css?v=20260304d">
    <link rel="stylesheet" href="css/fonts.css?v=20260304g">

    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">

    <nav id="navbar-placeholder" role="navigation"></nav>

    <main class="flex-grow container mx-auto px-4 py-10" role="main">
        <div class="max-w-lg mx-auto">
            <div id="state-confirm" class="bg-white rounded-3xl border border-gray-100 shadow-soft-card p-8 text-center">
                <div class="mb-4">
                    <i class="fas fa-envelope-open text-4xl text-orange-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Unsubscribe from emails</h1>
                <p id="confirm-text" class="text-slate-600 mb-6"></p>
                <button id="confirm-btn" type="button" class="px-6 py-2.5 rounded-xl tsts-btn-primary font-bold transition">
                    Confirm Unsubscribe
                </button>
                <p id="confirm-status" class="text-sm mt-4 hidden"></p>
            </div>

            <div id="state-success" class="hidden bg-white rounded-3xl border border-green-100 shadow-soft-card p-8 text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle text-4xl text-green-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-tsts-ink mb-2 heading-serif">Unsubscribed</h1>
                <p id="success-text" class="text-slate-600 mb-6"></p>
                <a href="profile.html" class="inline-block px-6 py-2.5 rounded-xl tsts-btn-primary font-bold transition">
                    Manage Email Preferences
                </a>
            </div>

            <div id="state-error" class="hidden bg-white rounded-3xl border border-red-100 shadow-soft-card p-8 text-center">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-red-700 mb-2 heading-serif">Unable to unsubscribe</h1>
                <p id="error-text" class="text-red-600 mb-6"></p>
                <a href="profile.html" class="inline-block px-6 py-2.5 rounded-xl tsts-btn-primary font-bold transition">
                    Manage Email Preferences
                </a>
            </div>
        </div>
    </main>

    <footer id="footer-placeholder" role="contentinfo"></footer>
    <script src="js/runtime-config.js?v=20260224a"></script>
    <script src="js/common.js?v=20260304g"></script>
    <script>
    (function () {
        var params = new URLSearchParams(window.location.search || "");
        var userId = String(params.get("userId") || "").trim();
        var category = String(params.get("category") || "").trim();
        var ts = String(params.get("ts") || "").trim();
        var token = String(params.get("token") || "").trim();

        var stateConfirm = document.getElementById("state-confirm");
        var stateSuccess = document.getElementById("state-success");
        var stateError = document.getElementById("state-error");
        var confirmBtn = document.getElementById("confirm-btn");
        var confirmStatus = document.getElementById("confirm-status");

        var categoryLabels = { recommendations: "experience recommendation" };
        var categoryLabel = categoryLabels[category] || category || "notification";

        function showState(id) {
            if (stateConfirm) stateConfirm.classList.add("hidden");
            if (stateSuccess) stateSuccess.classList.add("hidden");
            if (stateError) stateError.classList.add("hidden");
            var el = document.getElementById(id);
            if (el) el.classList.remove("hidden");
        }

        if (!userId || !category || !ts || !token) {
            var errText = document.getElementById("error-text");
            if (errText && window.tstsText) window.tstsText(errText, "This unsubscribe link is invalid. Please manage your email preferences from your Profile settings.");
            showState("state-error");
            return;
        }

        var confirmText = document.getElementById("confirm-text");
        if (confirmText && window.tstsText) {
            window.tstsText(confirmText, "Click below to stop receiving " + categoryLabel + " emails from The Shared Table Story.");
        }

        if (confirmBtn) {
            confirmBtn.addEventListener("click", function () {
                confirmBtn.disabled = true;
                if (window.tstsText) window.tstsText(confirmBtn, "Processing\u2026");
                if (confirmStatus) {
                    confirmStatus.classList.remove("hidden", "text-red-600");
                    confirmStatus.classList.add("text-gray-500");
                    if (window.tstsText) window.tstsText(confirmStatus, "");
                }

                var apiBase = (window.__tstsApiBase || window.API_BASE || "");
                var url = apiBase + "/api/email/unsubscribe";

                fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: userId, category: category, ts: ts, token: token })
                }).then(function (res) {
                    return res.json().then(function (data) {
                        return { status: res.status, data: data };
                    }).catch(function () {
                        return { status: res.status, data: {} };
                    });
                }).then(function (result) {
                    if (result.data && result.data.ok === true) {
                        var successText = document.getElementById("success-text");
                        if (successText && window.tstsText) {
                            window.tstsText(successText, "You have been unsubscribed from " + categoryLabel + " emails. You can re-enable them anytime from your Profile settings.");
                        }
                        showState("state-success");
                    } else {
                        var errCode = (result.data && result.data.error) || "";
                        var msg = "This unsubscribe link is invalid or has expired. Please manage your email preferences from your Profile settings.";
                        if (errCode === "TOKEN_EXPIRED") {
                            msg = "This unsubscribe link has expired. Please manage your email preferences from your Profile settings.";
                        }
                        var errText2 = document.getElementById("error-text");
                        if (errText2 && window.tstsText) window.tstsText(errText2, msg);
                        showState("state-error");
                    }
                }).catch(function () {
                    var errText3 = document.getElementById("error-text");
                    if (errText3 && window.tstsText) window.tstsText(errText3, "Something went wrong. Please try again or manage your email preferences from your Profile settings.");
                    showState("state-error");
                });
            });
        }
    })();
    </script>
</body>
</html>
