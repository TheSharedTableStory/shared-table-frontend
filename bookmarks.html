<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <meta name="theme-color" content="#ea580c">
  <title>My Bookmarks – The Shared Table Story</title>
  <link rel="stylesheet" href="css/tailwind.css?v=20260224a">
  <link rel="stylesheet" href="css/fonts.css?v=20260224a">

  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">
  <nav id="navbar-placeholder" role="navigation"></nav>

  <main class="flex-grow container mx-auto px-4 py-10 max-w-6xl" role="main">
    <div class="flex items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold mb-2 heading-serif text-tsts-ink">My Bookmarks</h1>
        <p class="text-slate-600">Saved experiences you can come back to any time.</p>
      </div>
      <a href="explore.html" class="text-sm font-bold text-orange-600 hover:underline">Browse more</a>
    </div>

    <div id="state-loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-3xl shadow-soft-card p-4 space-y-3"><div class="skeleton h-40 w-full"></div><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div>
      <div class="bg-white rounded-3xl shadow-soft-card p-4 space-y-3 hidden sm:block"><div class="skeleton h-40 w-full"></div><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div>
      <div class="bg-white rounded-3xl shadow-soft-card p-4 space-y-3 hidden lg:block"><div class="skeleton h-40 w-full"></div><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-3 w-1/2"></div></div>
    </div>

    <div id="state-error" class="hidden text-center py-14">
      <p class="text-red-600 font-bold">Failed to load bookmarks.</p>
      <button id="retry-btn" type="button" class="mt-4 px-6 py-2 rounded-xl tsts-btn-primary font-bold transition">Retry</button>
    </div>

    <div id="state-empty" class="hidden text-center py-14 bg-white rounded-3xl border border-gray-100 shadow-soft-card">
      <div class="text-5xl mb-3">🔖</div>
      <h2 class="text-xl font-bold mb-2 heading-serif text-tsts-ink">No bookmarks yet</h2>
      <p class="text-slate-600 mb-6">Explore experiences and save the ones you love.</p>
      <a href="explore.html" class="inline-block px-8 py-3 rounded-full tsts-btn-primary font-bold transition">Explore</a>
    </div>

    <div id="grid" aria-live="polite" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer id="footer-placeholder" role="contentinfo"></footer>

  <script src="js/runtime-config.js?v=20260224a"></script>
  <script src="js/common.js?v=20260227d"></script>
  <script src="js/bookmarks.js?v=20260224a"></script>
</body>
</html>
