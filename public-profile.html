<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data: blob:; font-src 'self'; connect-src 'self' https://*.stripe.com https://api.cloudinary.com https://api.thesharedtablestory.com; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/icon-192.png">
    <meta name="theme-color" content="#ea580c">
    <title>Host Profile - The Shared Table Story</title>
    <link rel="stylesheet" href="css/tailwind.css?v=20260221d">
    <link rel="stylesheet" href="css/fonts.css?v=20260221f">

<link rel="manifest" href="manifest.json">
</head>
<body class="bg-tsts-cream text-slate-900 flex flex-col min-h-screen">

    <nav id="navbar-placeholder" role="navigation"></nav>

    <main class="flex-grow" role="main">
    <div class="flex-grow container mx-auto px-4 py-12">
        
        <div id="loading" class="text-center py-20">
            <i class="fas fa-spinner fa-spin text-4xl text-orange-600"></i>
        </div>

        <div id="error" class="hidden text-center py-20">
            <h2 class="text-2xl font-bold text-gray-700">Host not found</h2>
            <a href="explore.html" class="text-orange-600 hover:underline mt-4 inline-block">Back to Explore</a>
        </div>

        <div id="profile-content" class="hidden max-w-5xl mx-auto space-y-12">
            
            <div class="bg-white rounded-3xl shadow-soft-card border border-gray-100 p-8 flex flex-col md:flex-row gap-8 items-start">
                <div class="flex-shrink-0 relative">
                    <img id="host-pic" src="/assets/avatar-default.svg" alt="Host profile picture" class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover border-4 border-white shadow-lg">
                    <div id="host-badge" class="absolute bottom-2 right-2 bg-orange-100 text-orange-700 p-1.5 rounded-full border border-white shadow-sm hidden">
                        <i class="fas fa-check-circle text-lg"></i>
                    </div>
                </div>
                
                <div class="flex-grow">
                    <h1 id="host-name" class="text-3xl md:text-4xl font-bold text-tsts-ink mb-2 heading-serif"></h1>
                    <div class="flex items-center gap-4 text-sm text-gray-500 mb-6">
                        <span id="host-location"><i class="fas fa-map-marker-alt mr-1"></i> Global</span>
                        <span><i class="fas fa-star text-yellow-500 mr-1"></i> <span id="host-rating">New</span></span>
                    </div>
                    
                    <h3 class="text-lg font-bold mb-2 heading-serif text-tsts-ink">About me</h3>
                    <p id="host-bio" class="text-gray-600 leading-relaxed max-w-2xl">
                        This host hasn't written a bio yet.
                    </p>
                    <div class="mt-6 flex flex-wrap items-center gap-2">
                        <span class="inline-flex items-center rounded-full bg-blue-100 text-blue-700 px-3 py-1 text-xs font-bold">
                            Visible to: Public
                        </span>
                        <a id="report-user-link" href="report.html" class="inline-flex items-center gap-2 rounded-xl border border-red-200 text-red-700 px-3 py-1.5 text-xs font-bold hover:bg-red-50 transition">
                            <i class="fas fa-flag"></i>
                            Report this user
                        </a>
                    </div>
                </div>
            </div>

            <div id="reviews-container" class="hidden">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <i class="fas fa-comment-alt text-orange-600"></i> What Guests Say
                </h2>
                <div id="reviews-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>

            <div>
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <i class="fas fa-utensils text-orange-600"></i> Active Experiences
                </h2>
                
                <div id="experiences-grid" aria-live="polite" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>

                <div id="no-experiences" class="hidden text-center py-12 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                    <p class="text-gray-500">This host has no active listings at the moment.</p>
                </div>
            </div>

        </div>
    </div>
    </main>

    <footer id="footer-placeholder" role="contentinfo"></footer>
    <script src="js/runtime-config.js?v=20260222b"></script>
  <script src="js/common.js?v=20260222b"></script>
    <script src="js/public-profile.js?v=20260222b"></script>
</body>
</html>
